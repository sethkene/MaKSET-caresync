<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MaKSET CareSync – Clickable Prototype</title>
<style>
:root{--g:#0b5d34;--gl:#e6f3ec;--bg:#eef2ef;--card:#fff;--tx:#14231b;--mu:#66756c;--ln:#d9e2dc;--am:#f6b63c;--aml:#fff3d6;--rd:#c62828;--rdl:#fde4e4;--page:#dfe6e1;--cap:#3d4d43}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a14;--card:#18251d;--tx:#eaf3ed;--mu:#9bb0a3;--ln:#2a3b31;--gl:#1b3326;--aml:#3a2f12;--rdl:#3d1b1b;--page:#0a110d;--cap:#b9cbbf}}
:root[data-theme="dark"]{--bg:#101a14;--card:#18251d;--tx:#eaf3ed;--mu:#9bb0a3;--ln:#2a3b31;--gl:#1b3326;--aml:#3a2f12;--rdl:#3d1b1b;--page:#0a110d;--cap:#b9cbbf}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--page);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.cap{font-size:13px;color:var(--cap);text-align:center;padding:0 12px}
.jump{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:400px}
.jump button{font-size:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:14px;padding:4px 10px;cursor:pointer}
#phone{width:380px;height:760px;max-height:calc(100vh - 130px);background:var(--bg);border-radius:34px;border:8px solid #111;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3)}
@media (max-width:480px){#phone{width:100%;height:100%;max-height:none;border:0;border-radius:0;box-shadow:none}.cap,.jump{display:none}body{gap:0}}
#scr{flex:1;overflow-y:auto;position:relative}
.hd{background:var(--g);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.hd b{font-size:16px;display:block}.hd small{font-size:12px;opacity:.85}
.hd .bk{font-size:24px;cursor:pointer;width:26px}
.pad{padding:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.btn{display:block;width:100%;border:0;border-radius:10px;background:var(--g);color:#fff;font-size:15px;font-weight:600;padding:13px;cursor:pointer;margin:8px 0;text-align:center}
.btn.o{background:var(--card);color:var(--g);border:1.5px solid var(--g)}
.btn.s{padding:9px;font-size:13px}
.btn:active{opacity:.85}
.lbl{font-size:12px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:11px;font-size:14px;font-family:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ln);background:var(--card);border-radius:16px;padding:6px 11px;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.av{width:42px;height:42px;border-radius:50%;background:var(--gl);color:var(--g);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.pill{border-radius:14px;padding:3px 10px;font-size:12px;background:var(--gl);color:var(--g)}
.alert{background:var(--rdl);color:var(--rd);border-radius:8px;padding:9px 11px;font-size:13px;font-weight:600;cursor:pointer}
.sync{background:var(--aml);padding:9px 14px;font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;background:var(--am)}.dot.on{background:#2e9e5b}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px 4px;text-align:center;font-size:12px;cursor:pointer}
.tile i{display:block;font-style:normal;font-size:24px;margin-bottom:4px}
.tile.big{background:var(--g);color:#fff;font-size:14px;font-weight:600;padding:16px}
.li{display:flex;align-items:center;gap:10px;cursor:pointer}.li small{color:var(--mu);font-size:12px;display:block}
.li:after{content:"›";color:var(--mu);font-size:20px;margin-left:auto}
.tabs{display:flex;border-bottom:1px solid var(--ln);margin:10px 0}
.tabs div{flex:1;text-align:center;padding:9px;font-size:14px;color:var(--mu);cursor:pointer}
.tabs .on{color:var(--g);border-bottom:2px solid var(--g);font-weight:600}
.sec{font-weight:700;font-size:14px;margin-bottom:6px;color:var(--g)}
.nav{display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 0 4px}
.nav div{flex:1;text-align:center;font-size:11px;color:var(--mu);cursor:pointer}.nav i{display:block;font-style:normal;font-size:19px}.nav .on{color:var(--g);font-weight:700}
#toast{position:absolute;left:14px;right:14px;bottom:70px;background:#14231b;color:#fff;border-radius:10px;padding:11px 14px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;text-align:center}
#toast.show{opacity:1}
.splash{background:var(--g);color:#fff;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer}
.logo{width:110px;height:110px;border-radius:26px;background:#fff;color:var(--g);font-size:70px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.stat{font-size:26px;font-weight:700;color:var(--g)}
pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.5}
small.m{display:block;color:var(--mu);font-size:12px}
.stb{background:var(--g);color:#fff;font-size:12px;padding:6px 18px 3px;display:flex;justify-content:space-between;flex:none}.stb.lt{background:var(--card);color:var(--tx)}
@media (max-width:480px){.stb{display:none}}
.pf .pill{flex:1;text-align:center;padding:7px}
.bar{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:6px}.bar div{flex:1;background:var(--g);border-radius:4px 4px 0 0;position:relative;min-height:3px}.bar span{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:10px;color:var(--mu)}
table.t{width:100%;border-collapse:collapse;font-size:12px}.t td,.t th{padding:7px 4px;border-bottom:1px solid var(--ln);text-align:left}.t th{color:var(--mu);font-weight:600}
.up{color:var(--rd);font-weight:700}.wn{color:#b07a00;font-weight:700}
</style>
</head>
<body>
<div class="cap">MaKSET CareSync clickable prototype. Tap through it. On Home, tap the amber status bar to go online and watch the sync.</div>
<div id="phone"><div class="stb" id="stb"><b>9:41</b><span>▾ ◢ ▮</span></div><div id="scr"></div><div id="nav"></div><div id="toast"></div></div>
<div class="jump" id="jump"></div>
<script>
var S={off:true,pending:3,synced:41,cur:0,stack:[],tab:'Summary',q:'',g:'',k:'',i:0,
pts:[{n:'Amina Musa',s:'Female',a:'28 years',id:'MAK-002431',al:'Penicillin allergy',bg:'O+'},
{n:'Ibrahim Sani',s:'Male',a:'4 years',id:'MAK-002377',al:'',bg:'A+'},
{n:'Zainab Bello',s:'Female',a:'31 years',id:'MAK-002402',al:'',bg:'B+'}],
lab:[{p:'Amina Musa',t:'Malaria RDT, Hb/PCV'},{p:'Zainab Bello',t:'Urinalysis'}],
ph:[{p:'Ibrahim Sani',t:'Artemether-lumefantrine ×1'}],
ref:[{p:'Zainab Bello',w:'Referred to Bauchi General Hospital'},{p:'Ibrahim Sani',w:'Awaiting feedback from receiving facility'}]};
var $=function(i){return document.getElementById(i)};
function toast(m){var t=$('toast');t.textContent=m;t.className='show';clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=''},2400)}
function tog(el){el.classList.toggle('on')}
function ini(n){return n.split(' ').map(function(w){return w[0]}).join('')}
function hd(t,s,back){return '<div class="hd">'+(back?'<span class="bk" onclick="back()">‹</span>':'')+'<div><b>'+t+'</b>'+(s?'<small>'+s+'</small>':'')+'</div></div>'}
function syncBar(){return '<div class="sync" onclick="toggleNet()"><span class="dot '+(S.off?'':'on')+'"></span><b>'+(S.off?'Offline':'Online')+'</b><span class="sp"></span><small>'+(S.off?'Last synced: Today, 8:40 AM':S.pending?'Syncing…':'All records synced')+'</small></div>'}
function toggleNet(){S.off=!S.off;if(!S.off){toast('Internet found. Syncing in the background…');setTimeout(function(){if(!S.off){S.synced+=S.pending;S.pending=0;toast('All records synced');render()}},1600)}else toast('You are offline. Work continues on this device.');render()}
function P(){return S.pts[S.cur]}
function opts(a){return '<div class="chips">'+a.map(function(x){return '<span class="chip" onclick="tog(this)">'+x+'</span>'}).join('')+'</div>'}
function one(a){return '<div class="chips">'+a.map(function(x,i){return '<span class="chip'+(i?'':' on')+'" onclick="pick(this)">'+x+'</span>'}).join('')+'</div>'}
function pick(el){el.parentNode.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on')});el.classList.add('on')}
function done(m,to){S.pending++;toast(m);go(to,true)}
function resList(l){return l.length?l.map(function(x){return '<div class="card li" onclick="S.cur='+x[1]+';S.tab=\'Summary\';go(\'profile\')"><div class="av">'+ini(x[0].n)+'</div><div><b>'+x[0].n+'</b><small>'+x[0].s+' • '+x[0].a+'</small><small>Patient ID: '+x[0].id+'</small></div></div>'}).join(''):'<div class="card" style="color:var(--mu)">No match. Register this patient as new.</div>'}
function flt(){var q=S.q.toLowerCase();return S.pts.map(function(p,i){return[p,i]}).filter(function(x){return !q||(x[0].n+x[0].id).toLowerCase().indexOf(q)>-1})}
function sres(){$('res').innerHTML=resList(flt())}

var R={
splash:function(){clearTimeout(R.t);R.t=setTimeout(function(){if(S.stack[S.stack.length-1]==='splash')go('login',true)},2000);return '<div class="splash" onclick="go(\'login\',true)"><div class="logo">+</div><h1 style="font-size:36px">MaKSET</h1><p style="margin:6px 0 14px">Connected Care. Anywhere.</p><div style="width:40px;height:3px;background:#39c27a;margin-bottom:14px"></div><p>Offline-first PHC System</p></div>'},
login:function(){return '<div class="pad" style="text-align:center;padding-top:40px"><div class="logo" style="margin:0 auto 10px;width:80px;height:80px;font-size:50px;background:var(--g);color:#fff">+</div><h2 style="color:var(--g)">MaKSET</h2><p style="color:var(--g);margin-bottom:18px">Primary Healthcare</p><div class="card" style="text-align:left"><b style="font-size:14px">Azare Primary Health Centre</b><small class="m">Bauchi State</small></div><div style="text-align:left"><div class="lbl">Staff ID</div><input value="NRS-0142"><div class="lbl">Password</div><input type="password" value="password"></div><button class="btn" style="margin-top:20px" onclick="go(\'home\',true)">Log in</button><p style="color:var(--g);margin-top:14px;cursor:pointer" onclick="toast(\'The PHC administrator sets up each device once\')">Set up this device</p></div>'},
home:function(){return '<div class="hd" style="display:block;padding-bottom:14px"><small>☰</small><div style="font-size:19px;font-weight:600;margin-top:10px">Good morning, Nurse Amina</div><small>Azare Primary Health Centre</small></div>'+syncBar()+'<div class="pad"><div class="grid" style="grid-template-columns:1fr 1fr"><div class="tile big" onclick="go(\'search\')"><i>🔍</i>Find Patient</div><div class="tile big" onclick="go(\'register\')"><i>➕</i>Register Patient</div></div><div class="sec" style="margin:14px 0 6px;color:var(--tx)">Services</div><div class="grid">'+[['🩺','OPD'],['🤰','ANC'],['👶','Child Health'],['💉','Immunization'],['🧪','Laboratory'],['↗️','Referrals']].map(function(x){return '<div class="tile" onclick="svc(\''+x[1]+'\')"><i>'+x[0]+'</i>'+x[1]+'</div>'}).join('')+'</div><div class="alert" style="margin-top:12px" onclick="go(\'refs\')">⚠ '+S.ref.length+' referrals need follow-up</div></div>'},
search:function(){return hd('Find or Register Patient','',1)+'<div class="pad"><input id="q" placeholder="Name, ID or phone number" value="'+S.q+'" oninput="S.q=this.value;sres()"><button class="btn o" onclick="toast(\'The camera opens here to scan the patient QR card\')">Scan Patient QR</button><div class="lbl">Search results (searched on this device)</div><div id="res">'+resList(flt())+'</div><button class="btn" onclick="go(\'register\')">Register New Patient</button></div>'},
register:function(){return hd('Register Patient','Capture identity once',1)+'<div class="pad"><div class="lbl">First name</div><input id="fn" value="Hauwa"><div class="lbl">Surname</div><input id="sn" value="Garba"><div class="lbl">Sex</div>'+one(['Female','Male'])+'<div class="lbl">Date of birth</div><input type="date" value="1998-03-14"><div class="lbl">Phone number</div><input value="0803 555 0142"><div class="lbl">State / LGA / Ward</div><select><option>Bauchi / Katagum / Azare</option></select><div class="lbl">Address</div><input value="Behind the central market"><div class="card" style="margin-top:12px;background:var(--gl)">The duplicate check runs on this device before saving.</div><button class="btn" onclick="reg()">Save patient</button></div>'},
profile:function(){var p=P(),t=S.tab;var body=t==='Summary'?[['📅','Recent encounter','15 May 2025 • OPD'],['💊','Medications','1 active medication'],['🧪','Laboratory','No pending results'],['🤰','Maternal care','ANC: 24 weeks']].map(function(x){return '<div class="card li" onclick="go(\'encs\')"><span style="font-size:22px">'+x[0]+'</span><div><b>'+x[1]+'</b><small>'+x[2]+'</small></div></div>'}).join(''):t==='History'?'<div class="card li" onclick="go(\'opd\')"><div><b>OPD • 15 May 2025</b><small>Malaria, treated • synced</small></div></div><div class="card li"><div><b>ANC visit 3 • 02 Apr 2025</b><small>BP 110/70 • synced</small></div></div><div class="card li"><div><b>Registered • 10 Jan 2025</b><small>Azare PHC</small></div></div>':'<div class="card"><b>Immunization</b><small class="m">The schedule loads from approved national master data</small></div><div class="card"><b>Referrals</b><small class="m">None active</small></div>';
return hd(p.n,'Patient ID: '+p.id,1)+'<div class="pad"><div class="chips"><span class="pill">'+p.s+'</span><span class="pill">'+p.a+'</span><span class="pill">'+p.bg+'</span></div>'+(p.al?'<div class="alert" style="margin:10px 0">⚠ '+p.al+'</div>':'')+'<button class="btn" onclick="go(\'sel\')">Start New Encounter</button><button class="btn o" onclick="go(\'ref\')">Refer Patient</button><div class="tabs">'+['Summary','History','Services'].map(function(x){return '<div class="'+(x===t?'on':'')+'" onclick="S.tab=\''+x+'\';render()">'+x+'</div>'}).join('')+'</div>'+body+'</div>'},
encs:function(){return hd(P().n,'Encounters',1)+'<div class="pad"><button class="btn s" onclick="go(\'sel\')">New Encounter</button><div class="chips" style="margin:6px 0 10px"><span class="chip on">All</span><span class="chip">Today</span><span class="chip">OPD</span></div><div class="card li" onclick="go(\'opd\')"><div><b>OPD</b><small>15 May 2025 • Nurse Amina • Treated</small></div><span class="pill">Synced</span></div><div class="card li"><div><b>ANC</b><small>02 Apr 2025 • Nurse Amina • Completed</small></div><span class="pill">Synced</span></div></div>'},
sel:function(){return hd('New Encounter',P().n,1)+'<div class="pad"><div class="lbl">Choose the encounter type. This does not create another patient record.</div><div class="grid">'+[['🩺','OPD','opd'],['🛏️','Inpatient','gen'],['🤰','ANC','gen'],['🍼','Labour/Delivery','gen'],['🧑‍🍼','PNC','gen'],['💉','Immunization','gen'],['📅','Family Planning','gen'],['⚖️','Others (Growth, Nutrition)','gen']].map(function(x){return '<div class="tile" onclick="S.g=\''+x[1]+'\';go(\''+x[2]+'\')"><i>'+x[0]+'</i>'+x[1]+'</div>'}).join('')+'</div></div>'},
opd:function(){return hd('OPD Consultation',P().n+' • '+P().id,1)+'<div class="pad"><div class="card"><div class="sec">Attendance and complaint</div>'+one(['New attendance','Follow-up'])+'<div class="lbl">Presenting complaint</div><textarea rows="2">Fever and headache for 3 days</textarea><button class="btn o s" style="width:auto;padding:7px 12px;margin-top:8px" onclick="toast(\'Tap the mic and speak. The nurse reviews the text before saving.\')">🎤 Dictate</button></div><div class="card"><div class="sec">Investigations available at this PHC</div>'+opts(['Malaria RDT','Hb/PCV','Urinalysis','Blood glucose','HIV screen','Stool microscopy'])+'<button class="btn o s" style="margin-top:10px" onclick="S.lab.unshift({p:P().n,t:\'Selected tests\'});toast(\'Lab order sent. A task was added for the lab.\')">Send selected lab order</button></div><div class="card"><div class="sec">Diagnosis</div><input value="Uncomplicated malaria"><div class="lbl">Diagnosis method</div>'+one(['Confirmed by laboratory','Clinical diagnosis'])+'</div><div class="card"><div class="sec">Medication</div>'+opts(['Artemether-lumefantrine','Paracetamol','ORS + Zinc','Amoxicillin'])+'<button class="btn o s" style="margin-top:10px" onclick="S.ph.unshift({p:P().n,t:\'Prescription\'});toast(\'Sent to pharmacy. You stay on this page.\')">Send pharmacy order</button></div><div class="card"><div class="sec">Outcome</div>'+one(['Treated','Not treated','Admitted','Referred out'])+'</div><button class="btn" onclick="done(\'Saved on this device. Pending sync.\',\'profile\')">Complete OPD encounter</button></div>'},
gen:function(){return hd(S.g,P().n+' • '+P().id,1)+'<div class="pad"><div class="card"><div class="sec">One scrollable record</div><div class="lbl">Date and time</div><input type="datetime-local" value="2026-10-28T09:30"><div class="lbl">Key findings</div><textarea rows="3" placeholder="Enter findings"></textarea><div class="lbl">Notes</div><textarea rows="3"></textarea></div><div class="card" style="background:var(--gl)">The full '+S.g+' form with all approved register fields is built in the next phase.</div><button class="btn" onclick="done(\'Saved on this device. Pending sync.\',\'profile\')">Complete encounter</button></div>'},
tasks:function(){var f=function(a,k){return a.length?a.map(function(x,i){return '<div class="card li" onclick="S.k=\''+k+'\';S.i='+i+';go(\'tdet\')"><div><b>'+x.p+'</b><small>'+x.t+'</small></div></div>'}).join(''):'<div class="card" style="color:var(--mu)">Nothing waiting.</div>'};return hd('Tasks','Work inbox',0)+'<div class="pad"><div class="sec">Laboratory queue ('+S.lab.length+')</div>'+f(S.lab,'lab')+'<div class="sec" style="margin-top:14px">Pharmacy queue ('+S.ph.length+')</div>'+f(S.ph,'ph')+'</div>'},
tdet:function(){var x=S[S.k][S.i],lab=S.k==='lab';return hd(lab?'Enter results':'Dispense medicines',x.p,1)+'<div class="pad"><div class="card"><b>'+x.t+'</b>'+(lab?'<div class="lbl">Result</div>'+one(['Negative','Positive','Pending'])+'<div class="lbl">Comment</div><input placeholder="Optional comment">':'<div class="lbl">Status</div>'+one(['Dispensed in full','Partly dispensed','Not available']))+'</div><button class="btn" onclick="fin()">Complete</button></div>'},
ref:function(){return hd('Refer Patient',P().n,1)+'<div class="pad"><div class="lbl">Receiving facility</div><select><option>Bauchi General Hospital</option><option>Azare General Hospital</option></select><div class="lbl">Reason for referral</div><textarea rows="2">Severe malaria with persistent vomiting</textarea><div class="lbl">Urgency</div>'+one(['Emergency','Urgent','Routine'])+'<div class="lbl">Treatment already given</div><input value="Artesunate IM, first dose"><button class="btn" onclick="go(\'note\')">Generate referral note</button></div>'},
note:function(){var p=P();return hd('Referral note',p.n,1)+'<div class="pad"><div class="card"><pre><b>REFERRAL NOTE</b>\nFrom: Azare Primary Health Centre\nTo: Bauchi General Hospital\nPatient: '+p.n+' ('+p.id+')\n'+p.s+', '+p.a+'\nAllergy: '+(p.al||'None recorded')+'\nReason: Severe malaria with persistent vomiting\nTreatment given: Artesunate IM, first dose\nUrgency: Urgent\nDate: 28 Oct 2026\nReferred by: Nurse Amina</pre></div><button class="btn" style="background:#1fa855" onclick="S.ref.unshift({p:P().n,w:\'Referral sent. Awaiting feedback\'});toast(\'WhatsApp opens with this note ready to send\')">Share via WhatsApp</button><button class="btn o" onclick="toast(\'SMS opens with this note ready to send\')">Share via SMS</button></div>'},
refs:function(){return hd('Referrals','Follow-up needed',1)+'<div class="pad">'+S.ref.map(function(r){return '<div class="card"><b>'+r.p+'</b><small class="m">'+r.w+'</small><button class="btn o s" onclick="toast(\'The feedback form opens here\')">Record feedback</button></div>'}).join('')+'</div>'},
reports:function(){return hd('Reports','Monthly summary, generated automatically',0)+'<div class="pad"><div class="card"><div class="sec">October 2026 • Azare PHC</div><div class="grid" style="grid-template-columns:1fr 1fr"><div><div class="stat">'+(212+S.pending)+'</div><small class="m">OPD attendances</small></div><div><div class="stat">38</div><small class="m">ANC visits</small></div><div><div class="stat">64</div><small class="m">Immunizations</small></div><div><div class="stat">'+S.ref.length+'</div><small class="m">Referrals</small></div></div></div><div class="card" style="background:var(--gl)">No re-entry needed. These figures come from the visits you already recorded.</div><button class="btn o" onclick="toast(\'The monthly summary is ready to export for LGA reporting\')">Export monthly summary</button></div>'},
more:function(){return hd('More','Sync status',0)+'<div class="pad"><div class="card"><div class="sec">Sync status</div><div class="grid" style="grid-template-columns:1fr 1fr"><div><div class="stat" style="color:#b07a00">'+S.pending+'</div><small class="m">Pending</small></div><div><div class="stat">'+S.synced+'</div><small class="m">Synced</small></div></div></div><button class="btn" onclick="syncNow()">Sync now</button><div class="card li" onclick="toast(\'Language, device and staff profile\')"><div><b>Settings</b><small>Language, device, staff profile</small></div></div><div class="card li" onclick="go(\'login\',true)"><div><b>Log out</b></div></div></div>'}};

  S.sid=m?m.id:{creator:'DEV-0001',oc:'OC-NEW',asst:'AST-NEW',lab:'LAB-0031',pharm:'PHM-0017',nurse:'NRS-0142'}[pos];
  S.fac=m?m.fac:HOMEF;S.ver={};S.brk={};go('home',true)};
var oLg3=R.login;R.login=function(){return oLg3().replace(/<div class="lbl"[^>]*>Sign in as \(prototype\)<\/div><div id="f_role"[^>]*>[\s\S]*?<\/div><\/div>/,'').replace('>Staff ID<','>Name or email<').replace('<input placeholder="Enter your staff ID">','<input id="lg_u" placeholder="Name or email" autocomplete="off">').replace('<input type="password" placeholder="Enter your password">','<input id="lg_p" type="password" placeholder="Enter your password">').replace('Log In</button>','Log In</button><small class="m" style="margin-top:10px">Prototype: type nurse, lab, pharmacy, oc, assistant or creator in the password field.</small>')};
var oHX=homeX;homeX=function(){return oHX().replace(/<div class="tile big" onclick="go\('search'\)"><i>[^<]*<\/i>Find Patient<\/div>/,'')};
function admHome(){var a=STF.filter(function(s){return s.st==='Active'}).length;return '<div class="hd" style="display:block;padding-bottom:14px"><div style="font-size:19px;font-weight:600">Good morning, App Creator</div><small>Overall control \u2022 all facilities</small></div><div class="pad"><div class="grid"><div class="card"><div class="stat">'+FACS.length+'</div><small class="m">Facilities</small></div><div class="card"><div class="stat">'+a+'</div><small class="m">Active staff</small></div><div class="card"><div class="stat">'+(STF.length-a)+'</div><small class="m">No access</small></div></div><button class="btn" onclick="go(\'adm\')">Facilities, in-charges and staff</button><button class="btn o" onclick="go(\'login\',true)">Log out</button></div>'}
function asHome(){return '<div class="hd" style="display:block;padding-bottom:14px"><div style="font-size:19px;font-weight:600">Good morning, '+S.nm+'</div><small>OC assistant \u2022 '+S.fac+'</small></div><div class="pad"><button class="btn" onclick="go(\'stf\')">\ud83d\udc65 Staff and access</button><div class="card" style="background:var(--aml)">Your officer in charge decides whether you can also work as a nurse, lab technician or pharmacist.</div><button class="btn o" onclick="go(\'login\',true)">Log out</button></div>'}
var oHF=R.home;R.home=function(){
  if(S.pos==='creator')return admHome();
  if(S.role==='asst')return asHome();
  var h=oHF();
  if(S.role==='nurse')h=h.replace('Nurse Amina',S.nm);
  if(S.pos==='oc'||S.pos==='asst'){var n=STF.filter(function(s){return s.fac===S.fac&&s.st==='Active'}).length;h=h.replace('<div class="pad">','<div class="pad"><button class="btn o" onclick="go(\'stf\')">\ud83d\udc65 Staff and access ('+n+' active)</button>')}
  return h};
function sBt(i,st,l,red){return '<button class="btn s'+(red?'':' o')+'" style="margin:0'+(red?';background:var(--rd)':'')+'" onclick="stSet('+i+',\''+st+'\')">'+l+'</button>'}
function stSet(i,st){STF[i].st=st;S.pending++;toast(STF[i].n+': '+st);render()}
function sRow(s){var i=STF.indexOf(s),cr=S.pos==='creator',b='',can=cr||(S.pos==='oc'&&s.role!=='oc')||(S.pos==='asst'&&S.agr&&s.role!=='oc'&&s.role!=='asst');
  if(can){if(cr)b=s.st==='Active'?sBt(i,'Blocked','Block access',1):sBt(i,'Active','Restore access');else{if(s.st==='Active')b=sBt(i,'Suspended','Suspend');else if(s.st==='Suspended')b=sBt(i,'Active','Restore');if(s.st==='Active'||s.st==='Suspended')b+=sBt(i,'Terminated','Terminate',1)}}
  return '<div class="card"><div class="row"><div class="av">'+ini(s.n)+'</div><div><b>'+s.n+'</b><small class="m">'+RL[s.role]+' \u2022 '+s.id+'</small></div><span class="sp"></span><span class="pill" style="background:'+(s.st==='Active'?'var(--gl)':'var(--rdl)')+'">'+s.st+'</span></div>'+(b?'<div class="row" style="margin-top:8px">'+b+'</div>':'')+'</div>'}
R.adm=function(){var f=S.af||HOMEF,L=STF.filter(function(s){return s.fac===f});return hd('Facilities and staff','Creator control',1)+'<div class="pad"><div class="chips" style="margin-bottom:10px">'+FACS.map(function(x){return '<span class="chip'+(x[0]===f?' on':'')+'" onclick="S.af=\''+x[0]+'\';render()">'+x[0]+'</span>'}).join('')+'</div><div class="card"><b>'+f+'</b><small class="m">'+L.filter(function(s){return s.st==='Active'}).length+' active of '+L.length+' staff. Block the in-charge or any staff to remove their access to the app.</small></div>'+L.map(sRow).join('')+'</div>'};
R.stf=function(){var L=STF.filter(function(s){return s.fac===S.fac}),c=function(r){return L.filter(function(s){return s.role===r&&s.st==='Active'}).length},can=S.pos==='oc'||(S.pos==='asst'&&S.agr);
  return hd('Staff and access',S.fac,1)+'<div class="pad"><div class="grid" style="grid-template-columns:1fr 1fr">'+[['Nurses/CHEWs','nurse'],['Lab technicians','lab'],['Pharmacists','pharm'],['OC assistants','asst']].map(function(x){return '<div class="card"><div class="stat">'+c(x[1])+'</div><small class="m">'+x[0]+'</small></div>'}).join('')+'</div>'
  +(S.pos==='oc'?'<div class="card"><b>Assistant access</b><small class="m">By default the assistant can only see staff. Grant full access so the assistant can also work as nurse, lab technician and pharmacist.</small><div class="chips" style="margin-top:8px"><span class="chip'+(S.agr?' on':'')+'" onclick="S.agr=!S.agr;toast(S.agr?\'Assistant has full access\':\'Assistant access limited\');render()">Full access '+(S.agr?'granted':'not granted')+'</span></div></div>':'')
  +L.map(sRow).join('')
  +(can?'<div class="card"><div class="sec">Enrol new staff</div><div class="lbl">Full name</div><input id="en_n"><div class="lbl">Email</div><input id="en_e" type="email"><div class="lbl">Role</div><div id="en_r">'+one(['Nurse/CHEW','Lab technician','Pharmacy','OC assistant'])+'</div><button class="btn" onclick="enroll()">Enrol staff</button></div>':'')+'</div>'};
function enroll(){var n=$('en_n').value.trim(),e=$('en_e').value.trim().toLowerCase(),r=on('en_r')[0]||'Nurse/CHEW';if(!n){toast('Enter the staff name');return}
  var role=/Lab/.test(r)?'lab':/Pharm/.test(r)?'pharm':/assist/i.test(r)?'asst':'nurse';
  STF.push({id:{nurse:'NRS',lab:'LAB',pharm:'PHM',asst:'AST'}[role]+'-'+(1000+STF.length),n:n,e:e,role:role,fac:S.fac,st:'Active'});S.pending++;toast(n+' enrolled. They can now log in.');render()}
var oGo3=go;go=function(n,r){if((n==='adm'&&S.pos!=='creator')||(n==='stf'&&S.pos!=='oc'&&S.pos!=='asst')){toast('Not available for your role');return}oGo3(n,r)};
var oCn=cnt;cnt=function(){return(S.role==='admin'||S.role==='asst')?0:oCn()};
var oRn4=render;render=function(){oRn4();if(S.role==='admin'||S.role==='asst')$('nav').innerHTML='';if(S.role==='lab')[].forEach.call(document.querySelectorAll('#nav .nav>div'),function(d){if(d.textContent.indexOf('Patients')>-1)d.remove()})};
var oDr3=drw;drw=function(o){oDr3(o);if(!o||['oc','asst','creator'].indexOf(S.pos)<0)return;dv.innerHTML=dv.innerHTML.replace('Nurse Amina',S.nm).replace('NRS-0142',S.sid).replace('Nurse (PHC)',{oc:'Officer in charge',asst:'OC assistant',creator:'App creator'}[S.pos]);if(S.role!=='nurse')[].forEach.call(dv.querySelectorAll('.li'),function(d){if(/Dashboards|Surveillance|Sync status/.test(d.textContent))d.remove()})};
go('splash',true);
</script>
